[project]
name = "backcast"
version = "0.1.0"
description = "An AI SRE Incident Commander with production-grade agentic memory on CockroachDB + AWS"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
authors = [{ name = "Umar Hashmi" }]
keywords = ["agent", "sre", "cockroachdb", "vector-search", "aws", "bedrock", "memory"]

dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mangum>=0.19",
]

[project.urls]
Homepage = "https://github.com/umarhashmi2002/backcast"
Repository = "https://github.com/umarhashmi2002/backcast"

[project.scripts]
backcast = "backcast.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "boto3-stubs[bedrock-runtime,s3,secretsmanager]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backcast"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific
]
ignore = ["E501"] # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["backcast"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["psycopg.*", "mangum.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib --cov=backcast --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
    "integration: tests that require a live CockroachDB (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
branch = true
source = ["src/backcast"]

[tool.coverage.report]
show_missing = true
skip_covered = true
