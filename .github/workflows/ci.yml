name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · type · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Ruff (lint)
        run: uv run ruff check src tests
      - name: Ruff (format check)
        run: uv run ruff format --check src tests
      - name: Mypy (strict)
        run: uv run mypy src
      - name: Unit tests
        run: uv run pytest -m "not integration"

  integration:
    name: integration (live CockroachDB)
    runs-on: ubuntu-latest
    env:
      RETRACE_DATABASE_URL: postgresql://root@localhost:26257/retrace?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Start CockroachDB 25.2
        run: |
          docker run -d --name crdb -p 26257:26257 \
            cockroachdb/cockroach:latest-v25.2 start-single-node --insecure
          for i in $(seq 1 40); do
            if docker exec crdb cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then
              echo "CockroachDB ready"; break
            fi
            sleep 2
          done
      - name: Migrate schema
        run: uv run python -m retrace.db.migrate
      - name: Integration tests
        run: uv run pytest -m integration
